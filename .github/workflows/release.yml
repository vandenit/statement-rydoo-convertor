name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build and Bundle
        run: npm run bundle

      - name: Create Windows binary
        run: npx pkg dist/bundle.cjs --targets node18-win-x64 --output ./dist-exe/statement-convertor.exe

      - name: Create macOS binaries
        run: npx pkg dist/bundle.cjs --targets node18-macos-x64,node18-macos-arm64 --out-path ./dist-macos

      - name: Rename binaries for release
        run: |
          mv dist-exe/statement-convertor.exe statement-convertor-win.exe
          mv dist-macos/bundle-x64 statement-convertor-macos-x64
          mv dist-macos/bundle-arm64 statement-convertor-macos-arm64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            statement-convertor-win.exe
            statement-convertor-macos-x64
            statement-convertor-macos-arm64
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
